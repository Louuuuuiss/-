  </section>

</main>

<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50">

/* ============ 工具 ============ */
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function colorClasses(color) {
  const map = {
    blue:   { chip: "bg-blue-50 text-blue-800 hover:bg-blue-100", icon: "text-blue-600" },
    purple: { chip: "bg-purple-50 text-purple-800 hover:bg-purple-100", icon: "text-purple-600" },
    pink:   { chip: "bg-pink-50 text-pink-800 hover:bg-pink-100", icon: "text-pink-600" },
    amber:  { chip: "bg-amber-50 text-amber-800 hover:bg-amber-100", icon: "text-amber-600" }
  };
  return map[color] || map.blue;
}

        <span class="font-bold text-sm editable" contenteditable="${editMode}" data-di="${di}" data-field="day">${escapeHtml(day.day)}</span>
        <span class="text-xs bg-slate-700 px-2 py-0.5 rounded editable" contenteditable="${editMode}" data-di="${di}" data-field="tag">${escapeHtml(day.tag)}</span>

      <div class="p-4 space-y-3" id="day-items-${di}"></div>
      <div class="edit-toolbar px-4 pb-3">
        <button onclick="addItineraryItem(${di})" class="w-full bg-emerald-50 text-emerald-700 py-1.5 rounded-lg text-xs font-medium border border-emerald-200"><i class="fa-solid fa-plus mr-1"></i>新增時段</button>
      </div>
      <div class="px-4 pb-4 space-y-4" id="day-links-${di}"></div>
      <div class="edit-toolbar px-4 pb-3">
        <button onclick="addLinkCategory(${di})" class="w-full bg-blue-50 text-blue-700 py-1.5 rounded-lg text-xs font-medium border border-blue-200"><i class="fa-solid fa-link mr-1"></i>新增連結分類</button>
      </div>
    `;
    container.appendChild(card);

    const itemsContainer = card.querySelector(`#day-items-${di}`);
    (day.items || []).forEach((item, ii) => {
      const row = document.createElement("div");
      row.className = "flex items-start gap-3 border-b border-slate-100 pb-2 last:border-0 last:pb-0";
      row.innerHTML = `
        <span class="text-xs font-semibold bg-red-100 text-red-700 px-2 py-1 rounded shrink-0 mt-0.5 editable" contenteditable="${editMode}" data-di="${di}" data-ii="${ii}" data-field="time">${escapeHtml(item.time)}</span>
        <div class="flex-1">
          <p class="font-semibold text-sm editable" contenteditable="${editMode}" data-di="${di}" data-ii="${ii}" data-field="title">${escapeHtml(item.title)}</p>
          ${item.desc || editMode ? `<p class="text-xs text-slate-500 editable" contenteditable="${editMode}" data-di="${di}" data-ii="${ii}" data-field="desc">${escapeHtml(item.desc)}</p>` : ""}
          <div class="flex items-center justify-between mt-0.5">
            <span class="text-xs font-bold text-red-600 bg-red-50 px-1.5 py-0.5 rounded editable ${item.price ? '' : 'hidden'}" contenteditable="${editMode}" data-di="${di}" data-ii="${ii}" data-field="price">${escapeHtml(item.price)}</span>
            <button onclick="removeItineraryItem(${di},${ii})" class="edit-toolbar text-xs text-red-500 ml-auto"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `;
      itemsContainer.appendChild(row);
    });

    const linksContainer = card.querySelector(`#day-links-${di}`);
    (day.links || []).forEach((group, gi) => {
      const groupEl = document.createElement("div");
      const cc = colorClasses(group.color);
      groupEl.innerHTML = `
        <div class="flex items-center justify-between mb-2">
          <h3 class="font-bold text-sm text-slate-800 editable" contenteditable="${editMode}" data-di="${di}" data-gi="${gi}" data-field="category">${escapeHtml(group.category)}</h3>
          <button onclick="removeLinkCategory(${di},${gi})" class="edit-toolbar text-xs text-red-500"><i class="fa-solid fa-trash"></i></button>
        </div>
        <div class="flex flex-wrap gap-2" id="link-list-${di}-${gi}"></div>
        <div class="edit-toolbar mt-2">
          <button onclick="addLink(${di},${gi})" class="text-xs bg-emerald-50 text-emerald-700 px-2 py-1 rounded border border-emerald-200"><i class="fa-solid fa-plus mr-1"></i>新增連結</button>
        </div>
      `;
      linksContainer.appendChild(groupEl);

      const chips = groupEl.querySelector(`#link-list-${di}-${gi}`);
      (group.list || []).forEach((link, li) => {
        const chip = document.createElement("span");
        chip.className = `link-chip text-sm px-3 py-1.5 rounded-lg transition ${cc.chip}`;
        chip.innerHTML = `
          <a href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer" class="editable" contenteditable="${editMode}" data-di="${di}" data-gi="${gi}" data-li="${li}" data-field="name">${escapeHtml(link.name)}</a>
          <i class="fa-solid fa-map-pin ${cc.icon}"></i>
          <button onclick="removeLink(${di},${gi},${li})" class="edit-toolbar text-xs text-red-500 ml-1"><i class="fa-solid fa-trash"></i></button>
        `;
        chips.appendChild(chip);
      });
    });
  });
  bindEditable();
}

/* ============ 渲染米其林 ============ */
function renderMichelin() {
  const container = document.getElementById("michelin-list");
  container.innerHTML = "";
  if (!Array.isArray(michelinData)) michelinData = JSON.parse(JSON.stringify(defaultMichelin));

  const list = currentFilter === "all" ? michelinData : michelinData.filter(i => i.type === currentFilter);
  list.forEach((item) => {
    const realIndex = michelinData.indexOf(item);
    let badgeClass = "bg-slate-100 text-slate-700";
    let badgeText = "米其林入選";
    if (item.type === "star") { badgeClass = "bg-amber-100 text-amber-800 font-bold"; badgeText = "⭐ 一星"; }
    else if (item.type === "bib") { badgeClass = "bg-red-100 text-red-700 font-bold"; badgeText = "🍲 必比登"; }

    const card = document.createElement("div");
    card.className = "bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center";
    card.innerHTML = `
      <div class="pr-2 flex-1">
        <h3 class="font-bold text-sm text-slate-800 editable" contenteditable="${editMode}" data-mi="${realIndex}" data-field="name">${escapeHtml(item.name)}</h3>
        <p class="text-xs text-slate-500 mt-0.5 editable" contenteditable="${editMode}" data-mi="${realIndex}" data-field="desc">${escapeHtml(item.desc)}</p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <span class="text-[11px] px-2 py-1 rounded-md ${badgeClass}">${badgeText}</span>
        <button onclick="removeMichelin(${realIndex})" class="edit-toolbar text-xs text-red-500"><i class="fa-solid fa-trash"></i></button>
      </div>
    `;
    container.appendChild(card);
  });
  bindEditable();
}

/* ============ 绑定可编辑 ============ */
function bindEditable() {
  document.querySelectorAll(".editable[contenteditable='true']").forEach(el => {
    el.oninput = () => { markDirty(); syncFromDom(el); };
  });
}

function syncFromDom(el) {
  const f = el.dataset.field;
  const di = el.dataset.di !== undefined ? +el.dataset.di : null;
  const gi = el.dataset.gi !== undefined ? +el.dataset.gi : null;
  const li = el.dataset.li !== undefined ? +el.dataset.li : null;
  const ii = el.dataset.ii !== undefined ? +el.dataset.ii : null;
  const mi = el.dataset.mi !== undefined ? +el.dataset.mi : null;

  if (di !== null && gi !== null && li !== null) {
    itineraryData[di].links[gi].list[li][f] = el.textContent.trim();
  } else if (di !== null && gi !== null) {
    itineraryData[di].links[gi][f] = el.textContent.trim();
  } else if (di !== null && ii !== null) {
    itineraryData[di].items[ii][f] = el.textContent.trim();
  } else if (di !== null) {
    itineraryData[di][f] = el.textContent.trim();
  } else if (mi !== null) {
    michelinData[mi][f] = el.textContent.trim();
  }
}

/* ============ 行程操作 ============ */
function addItineraryItem(di) {
  if (!itineraryData[di].items) itineraryData[di].items = [];
  itineraryData[di].items.push({ time: "00:00-00:00", title: "新行程", desc: "", price: "" });
  markDirty(); renderItinerary();
}
function removeItineraryItem(di, ii) {
  if (!confirm("確定刪除這個時段？")) return;
  itineraryData[di].items.splice(ii, 1);
  markDirty(); renderItinerary();
}

/* ============ 連結操作 ============ */
function addLinkCategory(di) {
  const cat = prompt("分類名稱（例如：景點、美食）：");
  if (!cat) return;
  const color = prompt("顏色（blue / purple / pink / amber）：", "blue");
  if (!["blue","purple","pink","amber"].includes(color)) return alert("顏色錯誤");
  if (!itineraryData[di].links) itineraryData[di].links = [];
  itineraryData[di].links.push({ category: cat, color, list: [] });
  markDirty(); renderItinerary();
}
function removeLinkCategory(di, gi) {
  if (!confirm("確定刪除整個分類？")) return;
  itineraryData[di].links.splice(gi, 1);
  markDirty(); renderItinerary();
}
function addLink(di, gi) {
  const name = prompt("名稱：");
  if (!name) return;
  const url = prompt("網址（https://...）：", "https://");
  if (!url) return;
  itineraryData[di].links[gi].list.push({ name, url });
  markDirty(); renderItinerary();
}
function removeLink(di, gi, li) {
  if (!confirm("確定刪除這個連結？")) return;
  itineraryData[di].links[gi].list.splice(li, 1);
  markDirty(); renderItinerary();
}

/* ============ 米其林操作 ============ */
function addMichelin() {
  const name = prompt("餐廳名稱：");
  if (!name) return;
  const type = prompt("類型（star / bib / selected）：", "selected");
  if (!["star","bib","selected"].includes(type)) return alert("類型錯誤");
  michelinData.unshift({ name, type, desc: "米其林入選" });
  markDirty(); renderMichelin();
}
function removeMichelin(i) {
  if (!confirm(`確定刪除「${michelinData[i].name}」？`)) return;
  michelinData.splice(i, 1);
  markDirty(); renderMichelin();
}
function filterMichelin(type, btn) {
  currentFilter = type;
  document.querySelectorAll(".mich-btn").forEach(b => {
    b.classList.remove("bg-red-600","text-white","active");
    b.classList.add("bg-white","text-slate-600");
  });
  btn.classList.add("bg-red-600","text-white","active");
  btn.classList.remove("bg-white","text-slate-600");
  renderMichelin();
}

/* ============ 登录 ============ */
function onSettingsClick() {
  if (localStorage.getItem("token")) { toggleEditMode(); return; }
  document.getElementById("login-modal").classList.remove("hidden");
}
function closeLogin() {
  document.getElementById("login-modal").classList.add("hidden");
  document.getElementById("login-error").classList.add("hidden");
}
async function doLogin() {
  const username = document.getElementById("login-user").value.trim();
  const password = document.getElementById("login-pass").value;
  const errEl = document.getElementById("login-error");
  errEl.classList.add("hidden");
  if (!username || !password) { errEl.textContent = "請輸入帳密"; errEl.classList.remove("hidden"); return; }
  try {
    const res = await fetch(`${API_BASE}/api/login`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "登入失敗");
    localStorage.setItem("token", data.token);
    localStorage.setItem("tokenExpires", data.expires);
    closeLogin(); updateSettingsIcon(); toggleEditMode();
  } catch (e) { errEl.textContent = e.message; errEl.classList.remove("hidden"); }
}
function updateSettingsIcon() {
  const btn = document.getElementById("settings-btn");
  const loggedIn = !!localStorage.getItem("token");
  btn.innerHTML = loggedIn ? '<i class="fa-solid fa-pen-to-square"></i>' : '<i class="fa-solid fa-gear"></i>';
  btn.title = loggedIn ? "編輯模式" : "設定";
}
function toggleEditMode() {
  editMode = !editMode;
  document.body.classList.toggle("edit-mode", editMode);
  renderItinerary(); renderMichelin();
  if (!editMode) { dirty = false; document.getElementById("save-bar").classList.add("hidden"); }
}

/* ============ 保存 ============ */
function markDirty() {
  if (!editMode) return;
  dirty = true;
  document.getElementById("save-bar").classList.remove("hidden");
}
async function saveAll() {
  const token = localStorage.getItem("token");
  if (!token) return alert("請先登入");
  const btn = document.getElementById("save-btn");
  btn.textContent = "儲存中..."; btn.disabled = true;
  try {
    const [r1, r2] = await Promise.all([
      fetch(`${API_BASE}/api/content/itinerary`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ content: JSON.stringify(itineraryData) })
      }),
      fetch(`${API_BASE}/api/content/michelin`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ content: JSON.stringify(michelinData) })
      })
    ]);
    if (!r1.ok || !r2.ok) {
      const e = await (r1.ok ? r2 : r1).json();
      throw new Error(e.error || "儲存失敗");
    }
    dirty = false;
    document.getElementById("save-bar").classList.add("hidden");
    alert("已儲存");
  } catch (e) {
    alert("儲存失敗：" + e.message);
  } finally {
    btn.textContent = "儲存"; btn.disabled = false;
  }
}
function cancelEdit() {
  if (!confirm("放棄未儲存的變更？")) return;
  loadData();
  dirty = false;
  document.getElementById("save-bar").classList.add("hidden");
}

/* ============ 读取 ============ */
async function loadData() {
  try {
    const [ri, rm] = await Promise.all([
      fetch(`${API_BASE}/api/content/itinerary`).then(r => r.json()),
      fetch(`${API_BASE}/api/content/michelin`).then(r => r.json())
    ]);
    if (ri.content) {
      try {
        const parsed = JSON.parse(ri.content);
        if (Array.isArray(parsed)) itineraryData = parsed;
      } catch (e) { console.warn("itinerary 解析失败", e); }
    }
    if (rm.content) {
      try {
        const parsed = JSON.parse(rm.content);
        if (Array.isArray(parsed)) michelinData = parsed;
      } catch (e) { console.warn("michelin 解析失败", e); }
    }
  } catch (e) { console.warn("載入失敗，使用預設資料", e); }
  renderItinerary();
  renderMichelin();
}

/* ============ Tab ============ */
function switchTab(tabId, btn) {
  document.querySelectorAll(".tab-content").forEach(s => s.classList.add("hidden"));
  document.getElementById(tabId).classList.remove("hidden");
  document.querySelectorAll(".nav-btn").forEach(b => { b.classList.remove("text-red-600","active"); b.classList.add("text-slate-400"); });
  btn.classList.add("text-red-600","active"); btn.classList.remove("text-slate-400");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ============ 初始化 ============ */
document.addEventListener("DOMContentLoaded", () => {
  updateSettingsIcon();
  const exp = localStorage.getItem("tokenExpires");
  if (exp && Date.now() > Number(exp)) {
    localStorage.removeItem("token"); localStorage.removeItem("tokenExpires");
    updateSettingsIcon();
  }
  loadData();
});
</script>
